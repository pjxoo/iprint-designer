<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>i-print-designer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f5f5f5;
      }
      #root {
        height: 100%;
      }
      /* 全屏首屏占位：React 灌库完成前只保留这一层，避免二次 loading */
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin: 0;
        background: #f5f5f5;
        color: #595959;
        font: 13px/1.4 system-ui, sans-serif;
        user-select: none;
      }
      #app-boot[hidden] {
        display: none;
      }
      #app-boot .app-boot-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid #d9d9d9;
        border-top-color: #1677ff;
        border-radius: 50%;
        animation: app-boot-spin 0.7s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-D2lH54XT.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CPmEVuQv.css">
  </head>
  <body>
    <div id="app-boot" role="status" aria-live="polite" aria-busy="true">
      <div class="app-boot-spinner" aria-hidden="true"></div>
      <span id="app-boot-tip">加载中…</span>
    </div>
    <div id="root"></div>
  </body>
</html>
